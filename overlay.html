<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>OBS Overlay · Phantom Awards</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500;600;700&display=swap">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Inter,system-ui,'Noto Sans Tamil',sans-serif;color:#fff}
body.bg{background:radial-gradient(circle at 50% 30%,#2a1054,#050507 70%)}
#o{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.panel{position:relative;width:min(94vw,1100px);text-align:center;padding:3.4vh 3vw;border-radius:28px;background:linear-gradient(180deg,rgba(18,9,36,.9),rgba(8,4,18,.9));border:1px solid rgba(168,85,247,.6);box-shadow:0 0 0 1px rgba(245,197,66,.15) inset,0 0 80px rgba(168,85,247,.4),0 30px 80px rgba(0,0,0,.5);animation:in .6s cubic-bezier(.2,1.3,.4,1)}
.panel::before{content:'';position:absolute;left:50%;top:0;width:40%;height:2px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#f5c542,transparent)}
.brand{font:700 clamp(11px,1.5vw,17px) Cinzel,Georgia,serif;letter-spacing:.4em;color:#f5c542}
h2{margin:1.2vh 0;font:700 clamp(22px,4.2vw,50px)/1.15 Cinzel,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:#e9d5ff}
.q{font:600 clamp(18px,3vw,36px) Cinzel,Georgia,serif;letter-spacing:.06em;color:#a99fcc;animation:pulse 1.3s infinite;padding:5vh 0}
.img{display:block;width:min(60vw,540px);aspect-ratio:16/9;object-fit:cover;border-radius:18px;box-shadow:0 0 50px rgba(245,197,66,.55);border:3px solid #f5c542;margin:1.4vh auto;animation:in .7s cubic-bezier(.2,1.3,.4,1)}
.tagw{font-weight:700;font-size:clamp(11px,1.4vw,16px);letter-spacing:.4em;color:#f5c542;margin-top:.6vh}
.w{font:700 clamp(28px,6.2vw,78px)/1.05 Cinzel,Georgia,serif;color:#f5c542;text-shadow:0 0 36px rgba(245,197,66,.65);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.st{font-size:clamp(16px,2.6vw,30px);margin-top:1vh;font-variant-numeric:tabular-nums}
.ru{margin-top:1.6vh;display:flex;gap:2.4vw;justify-content:center;flex-wrap:wrap;font-size:clamp(13px,1.9vw,23px);color:#cbbcf0}
.ru span{display:inline-flex;align-items:center;gap:.6em}
.medal{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;font:700 .75em Cinzel,serif;color:#2a1a00}
.m2{background:linear-gradient(135deg,#fff,#cfd4dc 55%,#8e96a3)}.m3{background:linear-gradient(135deg,#ffd5b0,#d98a4e 55%,#9a5420)}
.msg{font-size:clamp(16px,2.6vw,30px);color:#cbbcf0;padding:4vh 0}
@keyframes in{from{transform:scale(.88);opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
</style>
<script src="config.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<div id="o"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="js/overlay.js"></script>
</body>
</html>
