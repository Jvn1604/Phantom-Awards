<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Phantom Awards · OBS Overlay</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Trebuchet MS',system-ui,'Noto Sans Tamil',sans-serif;color:#fff}
body.bg{background:radial-gradient(circle at 50% 30%,#2a1054,#050507 70%)}
#o{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.panel{width:min(94vw,1100px);text-align:center;padding:3vh 3vw;border-radius:28px;background:rgba(8,4,18,.84);border:2px solid rgba(168,85,247,.7);box-shadow:0 0 80px rgba(168,85,247,.45);animation:in .6s cubic-bezier(.2,1.3,.4,1)}
.brand{letter-spacing:.35em;font-size:clamp(11px,1.6vw,18px);color:#c4b5fd}
h2{margin:1vh 0;font-size:clamp(22px,4.4vw,52px);letter-spacing:.12em;text-transform:uppercase;color:#d8b4fe}
.q{font-size:clamp(18px,3vw,36px);color:#a79ccc;animation:pulse 1.2s infinite;padding:5vh 0}
.img{display:block;width:min(64vw,560px);aspect-ratio:16/9;object-fit:cover;border-radius:18px;box-shadow:0 0 50px rgba(245,197,66,.6);border:4px solid #f5c542;margin:1.4vh auto}
.w{font-size:clamp(28px,6.4vw,80px);font-weight:800;color:#f5c542;text-shadow:0 0 36px #f5c542;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.st{font-size:clamp(16px,2.8vw,32px);margin-top:1vh}
.ru{margin-top:1.4vh;display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;font-size:clamp(13px,2vw,24px);color:#cbbcf0}
.msg{font-size:clamp(16px,2.6vw,30px);color:#cbbcf0;padding:4vh 0}
@keyframes in{from{transform:scale(.85);opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<div id="o"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* OBS OVERLAY
   Add as a Browser Source in OBS (size 1920x1080). The background is transparent.
   Click the source (Interact) or press Space / → for the next step, ← to go back, R to reload results.
   Options added to the address:
     ?auto=8      move on by itself: winner shown for 8 seconds, "And the winner is…" for 2.5 seconds
     ?cat=best-rpg  show only one category (its winner)
     ?bg=1        solid dark background (for testing in a normal browser)
     ?demo        fake results for a preview
*/
const SUPABASE_URL="https://bgklmhlffnhstxogvnln.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY="sb_publishable_bQYbN_cq18A5FacHNGg7KA_Lwhj7z2J";

const Q=new URLSearchParams(location.search),DEMO=Q.has('demo'),AUTO=+Q.get('auto')||0,ONLY=Q.get('cat');
if(Q.has('bg'))document.body.classList.add('bg');
const root=document.getElementById('o');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function cleanUrl(u){try{return new URL(u.trim()).origin;}catch(e){return u.trim();}}
function say(m){root.innerHTML='';const p=el('div','panel');p.append(el('div','msg',m));root.append(p);}

let cats=[],counts={},seq=[],ri=0,rs=0,timer=null;

async function load(){
  if(DEMO){
    cats=[['Game of the Year',['Resident Evil Requiem','Crimson Desert','Mina the Hollower','Pragmata']],['Best Boss Fight',['Saros','Mina the Hollower','Nioh 3']],['Best Soulslike',['Nioh 3','Code Vein II','Beast of Reincarnation']]]
      .map(([n,a],i)=>({id:'c'+i,name:n,noms:a.map((x,j)=>({id:i+'-'+j,name:x,img:null}))}));
    counts={};cats.forEach(c=>{counts[c.id]={};c.noms.forEach(n=>counts[c.id][n.id]=Math.floor(Math.random()*400)+20);});
  }else{
    if(SUPABASE_URL.startsWith('YOUR_')||typeof supabase==='undefined'){say('Paste your Supabase URL and key at the top of overlay.html');return false;}
    const sb=supabase.createClient(cleanUrl(SUPABASE_URL),SUPABASE_ANON_KEY.trim());
    const [c,n,t]=await Promise.all([sb.from('categories').select('*').order('sort'),sb.from('nominees').select('*').order('sort'),sb.rpc('get_totals')]);
    if(c.error||n.error){say('Could not load: '+(c.error||n.error).message);return false;}
    cats=c.data.map(x=>({id:x.id,name:x.name,noms:n.data.filter(m=>m.category_id===x.id).map(m=>({id:m.id,name:m.name,img:m.image_url}))}));
    counts={};(t.data||[]).forEach(r=>{(counts[r.category_id]=counts[r.category_id]||{})[r.choice]=r.votes;});
  }
  seq=cats.filter(c=>{const v=counts[c.id];return v&&Object.keys(v).length;}).reverse();   // Game of the Year last
  if(ONLY)seq=seq.filter(c=>c.id===ONLY);
  if(!seq.length){say('Results are not revealed yet.');return false;}
  return true;
}
function rank(c){
  const cc=counts[c.id]||{},tot=Object.values(cc).reduce((a,b)=>a+b,0);
  return c.noms.map(n=>({n,v:cc[n.id]||0,pct:tot?Math.round((cc[n.id]||0)*100/tot):0})).sort((a,b)=>b.v-a.v);
}
function draw(){
  root.innerHTML='';const p=el('div','panel');root.append(p);
  if(ri>=seq.length){p.append(el('div','brand','PHANTOM AWARDS 2026'),el('div','msg','Thank you for voting!'));return;}
  const c=seq[ri],r=rank(c),w=r[0];
  p.append(el('div','brand','PHANTOM AWARDS 2026'),el('h2',0,c.name));
  if(rs===0){p.append(el('div','q','And the winner is…'));return;}
  if(w.n.img){const im=el('img','img');im.src=w.n.img;im.alt='';im.referrerPolicy='no-referrer';im.onerror=()=>im.remove();p.append(im);}
  p.append(el('div','w',w.n.name),el('div','st',w.pct+'% · '+w.v+' votes'));
  const ru=r.slice(1,3).filter(x=>x.v>0);
  if(ru.length){const d=el('div','ru');ru.forEach((x,k)=>d.append(el('span',0,(k?'🥉 ':'🥈 ')+x.n.name+' · '+x.pct+'%')));p.append(d);}
}
function schedule(){
  clearTimeout(timer);
  if(!AUTO||ONLY&&rs===1||ri>=seq.length)return;
  timer=setTimeout(next,rs===0?2500:AUTO*1000);
}
function next(){
  if(ri>=seq.length)return;
  if(ONLY){rs=1;draw();return;}
  if(rs===0)rs=1;else{rs=0;ri++;}
  draw();schedule();
}
function prev(){clearTimeout(timer);if(rs===1)rs=0;else if(ri>0){ri--;rs=1;}draw();}
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft')prev();
  else if(e.key==='r'||e.key==='R')start();
});
document.addEventListener('click',next);
async function start(){clearTimeout(timer);ri=0;rs=ONLY?1:0;if(await load()){draw();schedule();}}
start();
</script>
</body>
</html>
