<style>
:root{--bg:#050507;--card:rgba(18,10,32,.8);--text:#f5f2ff;--mute:#a79ccc;--acc:#a855f7;--acc2:#e9d5ff;--gold:#f5c542}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Trebuchet MS',system-ui,'Noto Sans Tamil',sans-serif;background:radial-gradient(circle at 50% -10%,#2a1054,var(--bg) 55%) fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 14px var(--acc)}
.brand small{display:block;color:var(--mute);font-weight:400;font-size:11px;letter-spacing:.08em}
.lang{background:transparent;border:1px solid var(--acc);color:var(--acc2);border-radius:20px;padding:6px 14px;cursor:pointer;font:700 13px inherit}
h1{font-size:clamp(26px,6vw,46px);text-transform:uppercase;letter-spacing:.18em;margin:14px 0 4px;text-align:center;text-shadow:0 0 22px var(--acc)}
.sub{text-align:center;color:var(--mute);margin:0 0 18px;font-size:14px}
.cd{max-width:520px;margin:0 auto 18px;text-align:center;border:1px solid var(--acc);border-radius:8px;padding:12px;background:var(--card)}
.cd b{display:block;font-size:24px;letter-spacing:.06em;color:var(--acc2)}
.cd span{font-size:12px;color:var(--mute);letter-spacing:.15em;text-transform:uppercase}
.search{display:block;width:100%;max-width:420px;margin:0 auto 16px;padding:10px 14px;background:var(--card);border:1px solid var(--acc);border-radius:20px;color:var(--text);font:inherit}
.tile{animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.live{display:block;width:max-content;margin:0 auto 20px;background:var(--gold);color:#111;padding:12px 28px;border-radius:4px;font:800 14px system-ui,sans-serif;letter-spacing:.15em;text-decoration:none;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{aspect-ratio:1;background:var(--card);border:2px solid var(--acc);border-radius:6px;color:var(--text);font:800 14px/1.2 'Trebuchet MS',system-ui,sans-serif;text-transform:uppercase;text-align:center;padding:10px;position:relative;transition:.15s;text-decoration:none;display:flex;align-items:center;justify-content:center}
.tile:hover{transform:translateY(-3px);background:var(--acc);box-shadow:0 0 20px var(--acc)}
.tile.done::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--gold);font-size:16px}
.back{display:inline-block;color:var(--acc2);text-decoration:none;font-weight:700;margin:6px 0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:20px}
.g{background:var(--card);border:2px solid var(--acc);border-radius:6px;padding:18px;cursor:pointer;color:var(--text);text-align:left;font:inherit;position:relative}
.g:hover{box-shadow:0 0 14px var(--acc)}
.g.sel{box-shadow:0 0 0 3px var(--gold);border-color:var(--gold)}
.g b{display:block;font-size:18px;padding-right:20px}
.g .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:12px;overflow:hidden;display:none}
.g .bar i{display:block;height:100%;background:var(--acc)}
.g .pct{display:none;font-size:13px;font-weight:700;margin-top:6px}
.res .bar,.res .pct{display:block}
.g.win{border-color:var(--gold)}
.g.win .bar i{background:var(--gold)}
.tag{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;margin-top:8px;color:var(--gold)}
.tag.pick{color:var(--acc2)}
.act{text-align:center;margin-top:24px}
.vote{background:var(--gold);color:#111;border:0;border-radius:4px;padding:14px 40px;font:800 14px system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.vote:disabled{opacity:.4;cursor:not-allowed}
#msg{text-align:center;color:var(--mute);font-size:14px;min-height:22px;margin-top:12px}
.foot{text-align:center;margin-top:40px;color:var(--mute);font-size:13px}
.foot a{color:var(--acc2);margin:0 8px}
.stage{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 40%,#2a1054,#050507 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.stage h2{font-size:clamp(22px,5vw,44px);letter-spacing:.15em;text-transform:uppercase;margin:0 0 16px;color:var(--acc2)}
.stage .q{font-size:clamp(16px,3vw,24px);color:var(--mute);animation:pulse 1.2s infinite}
.stage .w{font-size:clamp(30px,8vw,84px);font-weight:800;color:var(--gold);text-shadow:0 0 40px var(--gold);animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.stage .st{margin-top:14px;font-size:clamp(14px,2.5vw,22px)}
.stage .hint{position:absolute;bottom:20px;font-size:12px;color:var(--mute)}
.stage .x{position:absolute;top:16px;right:20px;color:var(--acc2);text-decoration:none;font-size:14px}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{50%{opacity:.35}}
</style>

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function link(txt,href){const a=el('a',0,txt);a.href=href;a.target='_blank';a.rel='noopener';return a;}

function winnerOf(c){
  const cc=counts[c.id]||{};let best=null,tot=0;
  c.noms.forEach(n=>{const v=cc[n]||0;tot+=v;if(!best||v>best.v)best={n,v};});
  return best&&best.v>0?{name:best.n,v:best.v,pct:Math.round(best.v*100/tot)}:null;
}

async function loadData(){
  if(!online)return;
  const [c,m,tt,vc]=await Promise.all([
    sb.from('config').select('voting_ends,reveal_at').eq('id',1).maybeSingle(),
    sb.from('votes').select('category_id,choice'),
    sb.rpc('get_totals'),
    sb.rpc('public_voter_count')
  ]);
  voters=vc.data;
  if(c.data){cfg.ends=new Date(c.data.voting_ends);cfg.reveal=new Date(c.data.reveal_at);}
  counts={};(tt.data||[]).forEach(r=>{(counts[r.category_id]=counts[r.category_id]||{})[r.choice]=r.votes;});
  myChoices={};(m.data||[]).forEach(r=>{myChoices[r.category_id]=r.choice;});
}

    let s=Math.max(0,Math.floor((target-Date.now())/1000));
    const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);
    val.textContent=d+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s%60).padStart(2,'0')+'s';
  };
  tick();clearInterval(timer);timer=setInterval(()=>{if(!document.body.contains(box)){clearInterval(timer);return;}tick();},1000);
  return box;
}

function home(){
  app.innerHTML='';app.append(header());
  app.append(el('h1',0,'Phantom Awards 2026'));
  app.append(el('p','sub',t('choose')+' · '+Object.keys(myChoices).length+' / '+D.length+' '+t('voted')));
  if(voters!=null)app.append(el('p','sub','🔥 '+voters+' '+t('fans')));
  app.append(countdown());
  if(phase()==='revealed'){const a=el('a','live',t('live'));a.href='#/reveal';app.append(a);}
  if(phase()==='revealed'&&Object.keys(myChoices).length){
    const hit=D.filter(c=>{const w=winnerOf(c);return w&&myChoices[c.id]===w.name;}).length;
    app.append(el('p','sub','🎯 '+t('match')+' '+hit+' / '+Object.keys(myChoices).length));
  }
  const q=el('input','search');q.placeholder=t('search');
  app.append(q);
  const g=el('div','grid');
  D.forEach((c,i)=>{const a=el('a','tile'+(myChoices[c.id]?' done':''),c.name);a.href='#/'+c.id;a.style.animationDelay=(i*18)+'ms';g.append(a);});
  q.oninput=()=>{const v=q.value.trim().toLowerCase();[...g.children].forEach(a=>{a.style.display=a.textContent.toLowerCase().includes(v)?'':'none';});};
  app.append(g);
  if(msgText){const m=el('div');m.id='msg';m.textContent=msgText;app.append(m);}
  app.append(footer());
}

function cat(c){
  app.innerHTML='';app.append(header());
  const b=el('a','back',t('back'));b.href='#/';app.append(b);
  app.append(el('h1',0,c.name));
  const p=phase(),voted=myChoices[c.id],cc=counts[c.id]||{};
  const tot=Object.values(cc).reduce((a,b)=>a+b,0);
  const w=p==='revealed'?winnerOf(c):null;
  app.append(el('p','sub',p==='revealed'?t('revealed'):p==='closed'?t('closed'):voted?t('changeok'):t('pick')));
  const list=el('div','list'+(p==='revealed'?' res':''));
  const btn=el('button','vote',voted?t('change'):t('vote'));
  c.noms.forEach(nm=>{
    const x=el('button','g'+(pending===nm?' sel':'')+(w&&w.name===nm?' win':''));
    x.append(el('b',0,nm));
    if(p==='revealed'){
      const v=cc[nm]||0,pc=tot?Math.round(v*100/tot):0;
      const bar=el('div','bar'),i=el('i');i.style.width=pc+'%';bar.append(i);
      x.append(bar,el('div','pct',pc+'% · '+v+' '+t('votes')));
      if(w&&w.name===nm)x.append(el('span','tag',t('winner')));
      if(PICKS[c.name]===nm)x.append(el('span','tag pick',t('pickTag')));
    }
    if(voted===nm)x.append(el('span','tag',t('yourvote')));
    x.onclick=()=>{if(p!=='open')return;pending=nm;[...list.children].forEach(k=>k.classList.remove('sel'));x.classList.add('sel');btn.disabled=(nm===voted);};
    list.append(x);
  });
  btn.disabled=!pending||pending===voted;
  const act=el('div','act');if(p==='open')act.append(btn);
  const msg=el('div');msg.id='msg';
  msg.textContent=msgText||(p==='closed'&&voted?t('locked')+fmt(cfg.reveal):'');
  btn.onclick=async()=>{
    if(!pending)return;
    if(online){
      btn.disabled=true;
      const {error}=await sb.from('votes').upsert({category_id:c.id,choice:pending,updated_at:new Date().toISOString()},{onConflict:'voter_id,category_id'});
      if(error){msgText=/row-level security/i.test(error.message)?t('closed'):error.message;msg.textContent=msgText;btn.disabled=false;return;}
      msgText=t('saved');await loadData();confetti();
    }else{myChoices[c.id]=pending;msgText=t('noSave');}
    route();
  };
  app.append(list,act,msg,footer());
}

let ri=0,rs=0;
function reveal(){
  const seq=[...D].reverse(); // Game of the Year comes last
  if(phase()!=='revealed'){location.hash='#/';return;}
  const stage=el('div','stage');
  const draw=()=>{
    stage.innerHTML='';
    const x=el('a','x','Esc ✕');x.href='#/';x.onclick=e=>e.stopPropagation();stage.append(x);
    if(ri>=seq.length){
      stage.append(el('h2',0,t('thanks')),link('YouTube · DePhantom தமிழ்',CHANNEL_URL));return;
    }
    const c=seq[ri];
    stage.append(el('h2',0,c.name));
    if(rs===0){stage.append(el('div','q',t('and')));}
    else{
      const w=winnerOf(c);
      stage.append(el('div','w',w?w.name:t('none')));
      if(w)stage.append(el('div','st',w.pct+'% · '+w.v+' '+t('votes')));
      if(PICKS[c.name]&&w)stage.append(el('div','st',PICKS[c.name]===w.name?'★ = '+t('pickTag'):''));
    }
    stage.append(el('div','hint',(ri+1)+' / '+seq.length+' · '+t('click')));
  };
  const next=()=>{if(ri>=seq.length)return;if(rs===0)rs=1;else{rs=0;ri++;}draw();};
  stage.onclick=next;
  const key=e=>{if(e.key==='Escape'){location.hash='#/';}else if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();next();}};
  document.addEventListener('keydown',key);
  const off=()=>{document.removeEventListener('keydown',key);window.removeEventListener('hashchange',off);};
  window.addEventListener('hashchange',off);
  ri=0;rs=0;app.innerHTML='';app.append(stage);draw();
}

function confetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20';
  cv.width=innerWidth;cv.height=innerHeight;document.body.append(cv);const x=cv.getContext('2d');
  const cols=['#a855f7','#f5c542','#e9d5ff','#ffffff'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s);});if(++f<90)requestAnimationFrame(a);else cv.remove();})();
}
function route(){
  const id=(location.hash.match(/^#\/([a-z0-9-]+)/)||[])[1];
  if(id==='reveal')return reveal();
  const c=D.find(x=>x.id===id);
  if(c)cat(c);else home();
}
window.addEventListener('hashchange',async()=>{pending=null;msgText='';await loadData();route();window.scrollTo(0,0);});

(async()=>{
  route();
  if(DEMO){msgText='DEMO: fake results for previewing the reveal.';route();return;}
  if(!ready){msgText=t('noSave')+' (add your Supabase URL and anon key)';route();return;}
  try{
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;}
    online=true;await loadData();route();
  }catch(e){msgText='Could not connect to Supabase ('+(e.message||e)+'). Votes will not be saved.';route();}
})();
</script>
