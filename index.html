<style>
:root{--bg:#050507;--card:rgba(18,10,32,.8);--text:#f5f2ff;--mute:#a79ccc;--acc:#a855f7;--acc2:#e9d5ff;--gold:#f5c542;--bg2:#2a1054;--surf:var(--surf);--surf2:var(--surf2);--track:var(--track)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Trebuchet MS',system-ui,'Noto Sans Tamil',sans-serif;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 55%) fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 14px var(--acc)}
.brand small{display:block;color:var(--mute);font-weight:400;font-size:11px;letter-spacing:.08em}
.lang{background:transparent;border:1px solid var(--acc);color:var(--acc2);border-radius:20px;padding:6px 14px;cursor:pointer;font:700 13px inherit}
h1{font-size:clamp(26px,6vw,46px);text-transform:uppercase;letter-spacing:.18em;margin:14px 0 4px;text-align:center;text-shadow:0 0 22px var(--acc)}
.sub{text-align:center;color:var(--mute);margin:0 0 18px;font-size:14px}
.cd{max-width:520px;margin:0 auto 18px;text-align:center;border:1px solid var(--acc);border-radius:8px;padding:12px;background:var(--card)}
.cd b{display:block;font-size:24px;letter-spacing:.06em;color:var(--acc2)}
.cd span{font-size:12px;color:var(--mute);letter-spacing:.15em;text-transform:uppercase}
.search{display:block;width:100%;max-width:420px;margin:0 auto 16px;padding:10px 14px;background:var(--card);border:1px solid var(--acc);border-radius:20px;color:var(--text);font:inherit}
.tile{animation:fadeUp .4s backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.navb{padding:12px 24px;border:2px solid var(--acc);border-radius:4px;color:var(--text);text-decoration:none;font-weight:700}
.navb:hover{background:var(--acc)}
.navb.gold{background:var(--gold);color:#111;border-color:var(--gold)}
.nimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;margin-bottom:10px;display:block}
.wimg{max-height:34vh;max-width:90vw;border-radius:8px;margin-bottom:16px;box-shadow:0 0 40px var(--acc)}
.login{max-width:440px;margin:28px auto;text-align:center;border:1px solid var(--acc);border-radius:8px;padding:28px;background:var(--card)}
.gbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#222;border:0;border-radius:4px;padding:12px 26px;font:700 15px system-ui,sans-serif;cursor:pointer}

function winnerOf(c){
  const cc=counts[c.id]||{};let best=null,tot=0;
  c.noms.forEach(n=>{const v=cc[n.id]||0;tot+=v;if(!best||v>best.v)best={n,v};});
  return best&&best.v>0?{id:best.n.id,name:best.n.name,img:best.n.img,v:best.v,pct:Math.round(best.v*100/tot)}:null;
}

let catsAt=0;
async function loadCats(){
  if(Date.now()-catsAt<60000)return;catsAt=Date.now();
  const [c,n]=await Promise.all([sb.from('categories').select('*').order('sort'),sb.from('nominees').select('*').order('sort')]);
  if(c.error||n.error||!c.data||!c.data.length)return;
  D=c.data.map(x=>({id:x.id,name:x.name,closed:x.closed,noms:(n.data||[]).filter(m=>m.category_id===x.id).map(m=>({id:m.id,name:m.name,img:m.image_url,link:m.link_url}))}));
}
async function loadData(){
  if(!online)return;
  await Promise.all([loadCats(),loadCollabs()]);
  const [c,m,tt,vc]=await Promise.all([
    sb.from('config').select('*').eq('id',1).maybeSingle(),
    sb.from('votes').select('category_id,choice'),
    sb.rpc('get_totals'),
    sb.rpc('public_voter_count')
  ]);
  voters=vc.data;
  if(c.data){cfg.ends=new Date(c.data.voting_ends);cfg.reveal=new Date(c.data.reveal_at);cfg.paused=!!c.data.paused;cfg.announcement=c.data.announcement||'';}
  counts={};(tt.data||[]).forEach(r=>{(counts[r.category_id]=counts[r.category_id]||{})[r.choice]=r.votes;});
  myChoices={};(m.data||[]).forEach(r=>{myChoices[r.category_id]=r.choice;});
}

  ai.onchange=()=>{auto=ai.checked;try{localStorage.setItem('auto',auto?'1':'0');}catch(e){}};
  al.append(ai,document.createTextNode(' '+t('auto')));
  const act=el('div','act');if(open)act.append(btn,al);
  const msg=el('div');msg.id='msg';
  msg.textContent=msgText||(p==='closed'&&voted?t('locked')+fmt(cfg.reveal):'');
  btn.onclick=async()=>{
    if(!pending)return;
    if(online){
      btn.disabled=true;
      const {error}=await sb.from('votes').upsert({category_id:c.id,choice:pending,updated_at:new Date().toISOString()},{onConflict:'voter_id,category_id'});
      if(error){msgText=/row-level security/i.test(error.message)?t('closed'):error.message;msg.textContent=msgText;btn.disabled=false;return;}
      msgText=t('saved');await loadData();confetti();
    }else{myChoices[c.id]=pending;msgText=t('noSave');}
    justVoted=c.id;route();
    if(auto)setTimeout(()=>{if(location.hash==='#/'+c.id)location.hash=goNext;},1300);
  };
  const nav=el('div','nav');
  const pa=el('a','navb','← '+t('prev'));pa.href='#/'+prv.id;
  const na=el('a','navb'+(voted?' gold':''),home_?t('finish')+' ✓':(voted?t('cont'):p==='open'?t('skip'):t('next'))+' →');
  na.href=goNext;nav.append(pa,na);
  app.append(list,act,msg,nav,footer());
  justVoted=null;checkBadges();
  // keyboard shortcuts
  catKey=e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||''))return;
    if(e.key==='ArrowRight')location.hash=goNext;
    else if(e.key==='ArrowLeft')location.hash='#/'+prv.id;
    else if(open&&/^[1-9]$/.test(e.key)){const n=c.noms[+e.key-1];if(n){pending=n.id;paintSel();}}
    else if(open&&e.key==='Enter'&&pending&&pending!==voted){btn.click();}
  };
  document.addEventListener('keydown',catKey);
}

let ri=0,rs=0;
function reveal(){
  const seq=[...D].reverse(); // Game of the Year comes last
  if(phase()!=='revealed'){location.hash='#/';return;}
  const stage=el('div','stage');
  const draw=()=>{
    stage.innerHTML='';
    const x=el('a','x','Esc ✕');x.href='#/';x.onclick=e=>e.stopPropagation();stage.append(x);
    if(ri>=seq.length){
      stage.append(el('h2',0,t('thanks')),link('YouTube · DePhantom தமிழ்',CHANNEL_URL));return;
    }
    const c=seq[ri];
    stage.append(el('h2',0,c.name));
    if(rs===0){stage.append(el('div','q',t('and')));}
    else{
      const w=winnerOf(c);
      if(w&&w.img){const im=el('img','wimg');im.src=w.img;stage.append(im);}
      stage.append(el('div','w',w?w.name:t('none')));
      if(w)stage.append(el('div','st',w.pct+'% · '+w.v+' '+t('votes')));
      if(PICKS[c.name]&&w)stage.append(el('div','st',PICKS[c.name]===w.name?'★ = '+t('pickTag'):''));
    }
    stage.append(el('div','hint',(ri+1)+' / '+seq.length+' · '+t('click')));
  };
  const next=()=>{if(ri>=seq.length)return;if(rs===0)rs=1;else{rs=0;ri++;}draw();};
  stage.onclick=next;
  const key=e=>{if(e.key==='Escape'){location.hash='#/';}else if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();next();}};
  document.addEventListener('keydown',key);
  const off=()=>{document.removeEventListener('keydown',key);window.removeEventListener('hashchange',off);};
  window.addEventListener('hashchange',off);
  ri=0;rs=0;app.innerHTML='';app.append(stage);draw();
}

function confetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20';
  cv.width=innerWidth;cv.height=innerHeight;document.body.append(cv);const x=cv.getContext('2d');if(!x){cv.remove();return;}
  const cols=['#a855f7','#f5c542','#e9d5ff','#ffffff'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s);});if(++f<90)requestAnimationFrame(a);else cv.remove();})();
}
const GSVG='<svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function orbs(h){h.append(el('i','orb o1'),el('i','orb o2'),el('i','orb o3'));}
function splash(){
  app.innerHTML='';const h=el('div','hero');orbs(h);
  const im=el('img','hlogo');im.src=LOGO;im.alt='';h.append(im);app.append(h);
}
function loginPage(){
  app.innerHTML='';const h=el('div','hero');orbs(h);
  const l=el('button','lang hl',lang==='en'?'தமிழ்':'EN');
  l.onclick=()=>{lang=lang==='en'?'ta':'en';try{localStorage.setItem('lang',lang);}catch(e){}loginPage();};
  const card=el('div','lcard');
  const im=el('img','hlogo');im.src=LOGO;im.alt='DePhantom';
  const chips=el('div','chips');
  [D.length+' '+t('cats'),t('chipLive'),t('chipFree')].forEach(x=>chips.append(el('span','chip',x)));
  const b=el('button','gbtn2');const ic=el('span');ic.innerHTML=GSVG;b.append(ic,el('span',0,t('google')));
  const m=el('p','sub');
  b.onclick=async()=>{b.disabled=true;
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(error){m.textContent=error.message;b.disabled=false;}};
  card.append(im,el('div','pre',t('by')),el('h1',0,'Phantom Awards'),el('div','yr','2026'),el('p','tag',t('tag')),chips,b,m,el('p','fine',t('loginNote')));

  if(!DISCORD_URL.startsWith('YOUR_'))f.append(link('Discord',DISCORD_URL));
  f.append(link('Privacy','privacy.html'),link('Terms','terms.html'));
  const hw=el('div','hlw');hw.append(themeBtn(),l);h.append(hw,card,f);app.append(h);
}
function route(){
  if(catKey){document.removeEventListener('keydown',catKey);catKey=null;}
  if(needLogin)return loginPage();
  const id=(location.hash.match(/^#\/([a-z0-9-]+)/)||[])[1];
  if(id==='reveal')return reveal();
  const c=D.find(x=>x.id===id);
  if(c)cat(c);else home();
}
window.addEventListener('hashchange',async()=>{pending=null;msgText='';await loadData();route();window.scrollTo(0,0);});

function startBg(){
  document.addEventListener('click',()=>document.querySelectorAll('.uchip.open').forEach(x=>x.classList.remove('open')));
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=document.createElement('canvas');cv.id='bg';document.body.prepend(cv);
  const x=cv.getContext&&cv.getContext('2d');if(!x)return;
  let W=0,H=0;const P=[];
  const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};size();addEventListener('resize',size);
  const N=Math.min(60,Math.floor(innerWidth/22));
  for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.6});
  (function f(){
    if(!document.hidden){
      x.clearRect(0,0,W,H);
      P.forEach((a,i)=>{a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;
        x.fillStyle=document.documentElement.dataset.theme==='light'?'rgba(124,58,237,.55)':'rgba(196,160,255,.7)';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();
        for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
          if(d<14000){x.strokeStyle='rgba(168,85,247,'+(.22*(1-d/14000))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}});
    }
    requestAnimationFrame(f);
  })();
}
startBg();
(async()=>{
  if(DEMO||!ready)route();else splash();
  if(DEMO){msgText='DEMO: fake results for previewing the reveal.';route();return;}
  if(!ready){msgText=t('noSave')+' (add your Supabase URL and anon key)';route();return;}
  try{
    sb=supabase.createClient(cleanUrl(SUPABASE_URL),SUPABASE_ANON_KEY.trim(),{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
    const {data:{session}}=await sb.auth.getSession();
    if(!session||session.user.is_anonymous){needLogin=true;route();return;}
    user=session.user;online=true;await loadData();route();
  }catch(e){msgText='Could not connect to Supabase ('+(e.message||e)+'). Votes will not be saved.';route();}
})();
