<!DOCTYPE html>

<meta charset="utf-8">

<title>Phantom Awards · Admin</title>
<style>
:root{--bg:#050507;--card:#120a20;--text:#f5f2ff;--mute:#a79ccc;--acc:#a855f7;--gold:#f5c542;--line:#2a1b45;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2a1054,var(--bg) 50%) fixed;color:var(--text);font-family:system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0;font-size:24px;letter-spacing:.12em;text-transform:uppercase}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:14px}
.kpi b{display:block;font-size:28px;color:var(--gold)}
.kpi span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
@media(max-width:800px){.two{grid-template-columns:1fr}}
button,select,input{font:inherit;background:#1a1030;color:var(--text);border:1px solid var(--acc);border-radius:6px;padding:8px 12px}
button{cursor:pointer;font-weight:700}button:hover{background:var(--acc)}
button.gold{background:var(--gold);color:#111;border-color:var(--gold)}
button.red{border-color:var(--red);color:var(--red)}button.red:hover{background:var(--red);color:#111}
button.sm{padding:5px 9px;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button.on{background:var(--acc)}
.tab{display:none}.tab.on{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:12px;text-transform:uppercase}
tr.r{cursor:pointer}tr.r:hover,tr.sel{background:#201238}
.scroll{max-height:460px;overflow:auto}
.pill{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:#201238;display:inline-block}
.pill.tie{background:#7f1d1d}.pill.close{background:#78350f}.pill.ok{background:#14532d}
#login{max-width:340px;margin:12vh auto;text-align:center}
#login input{display:block;width:100%;margin:8px 0}
#status{color:var(--mute);font-size:13px}
.cv{position:relative;height:300px;width:100%}
canvas{display:block}
details.cat{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#0d0718}
details.cat>summary{padding:12px 14px;cursor:pointer;font-weight:700}
.body{padding:0 14px 14px}
.erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.erow input[type=text]{flex:1;min-width:140px}
.nom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.nom input.u{flex:1;min-width:160px}
.nom .nm{width:200px}
.thumb{width:64px;height:36px;object-fit:cover;border-radius:4px;background:#1a1030}
label.chk{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--mute)}
.note{color:var(--mute);font-size:13px}
</style>
</head>

function standing(c){
  const rows=c.noms.map(n=>({n,v:(T[c.id]||{})[n.id]||0})).sort((a,b)=>b.v-a.v);
  const total=rows.reduce((a,r)=>a+r.v,0),top=rows[0]?rows[0].v:0,second=rows[1]?rows[1].v:0;
  const leaders=top>0?rows.filter(r=>r.v===top).map(r=>r.n):[];
  return {rows,total,top,lead:top-second,leadPct:total?(top-second)*100/total:0,leaders,tie:leaders.length>1};
}
function mk(id,conf){
  if(typeof Chart==='undefined'){toast('Charts library did not load (ad-blocker?). Numbers and tables still work.');return;}
  conf.options=Object.assign({responsive:true,maintainAspectRatio:false,resizeDelay:150},conf.options||{});
  const old=charts[id];
  if(old&&old.config.type===conf.type){old.data=conf.data;old.options=conf.options;old.update('none');return;}
  if(old)old.destroy();
  charts[id]=new Chart($(id),conf);
}
function fillTable(tb,rows,cls){
  tb.innerHTML='';
  rows.forEach(r=>{const tr=el('tr',cls?cls(r):'');r.cells.forEach(v=>{const td=el('td');if(v&&v.pill){td.append(el('span','pill '+v.pill,v.t));}else td.textContent=String(v);tr.append(td);});if(r.click)tr.onclick=r.click;tb.append(tr);});
}

// ---------- login ----------
function loginView(msg){
  app.innerHTML='';const b=el('div','card');b.id='login';
  b.append(el('h1',0,'Admin'));
  const e=el('input');e.type='email';e.placeholder='Admin email';
  const p=el('input');p.type='password';p.placeholder='Password';
  const go=el('button','gold','Sign in');go.style.width='100%';
  const m=el('p');m.id='status';m.textContent=msg||'';
  go.onclick=async()=>{
    go.disabled=true;m.textContent='Signing in…';
    const {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});
    if(error){m.textContent=error.message;go.disabled=false;return;}
    start();
  };
  p.onkeydown=ev=>{if(ev.key==='Enter')go.click();};
  b.append(e,p,go,m);app.append(b);
}
async function start(){
  if(!sb)return fail(CFGERR);
  const {data:{session}}=await sb.auth.getSession();
  if(!session||session.user.is_anonymous)return loginView();
  const {data:ok,error:rpcErr}=await sb.rpc('is_admin');
  if(rpcErr){await sb.auth.signOut();return loginView('Database not set up yet ('+rpcErr.message+'). Run supabase-setup.sql in the Supabase SQL Editor.');}
  if(!ok){await sb.auth.signOut();return loginView('This account is not an admin.');}
  shell();await refresh({editor:true});
  clearInterval(timer);timer=setInterval(()=>{if($('auto').checked)refresh({editor:false});},30000);
}

// ---------- data ----------
async function refresh(o){
  o=o||{};toast('Loading…');
  const [a,b,c,k,n,vt,cl]=await Promise.all([sb.rpc('admin_totals'),sb.rpc('admin_overview'),sb.from('config').select('*').eq('id',1).maybeSingle(),
    sb.from('categories').select('*').order('sort'),sb.from('nominees').select('*').order('sort'),sb.rpc('admin_voters'),sb.from('collabs').select('*').order('sort')]);
  const err=a.error||b.error||k.error||n.error||vt.error||cl.error;
  if(err){toast('Error: '+err.message+' (did you run the latest supabase-setup.sql?)');return;}
  CATS=k.data.map(x=>({...x,noms:n.data.filter(m=>m.category_id===x.id).map(m=>({id:m.id,name:m.name,img:m.image_url,sort:m.sort,category_id:m.category_id}))}));
  NM={};CATS.forEach(c=>c.noms.forEach(m=>NM[m.id]=m));
  T={};unknown=0;
  (a.data||[]).forEach(r=>{if(NM[r.choice]&&NM[r.choice].category_id===r.category_id)(T[r.category_id]=T[r.category_id]||{})[r.choice]=r.votes;else unknown+=r.votes;});
  ov=b.data;cfg=c.data;VOT=vt.data||[];COLLABS=cl.data||[];

  if(o.editor){editor();collabsEditor();}
}

// ---------- races & wins ----------
function races(){
  if(!$('thr'))return;
  const thr=+$('thr').value||5;
  const list=CATS.map(c=>({c,s:standing(c)})).filter(x=>x.s.total>0).sort((a,b)=>a.s.leadPct-b.s.leadPct);
  fillTable($('rtb'),list.map(x=>({cells:[x.c.name,x.s.leaders.map(n=>n.name).join(' / '),x.s.tie?'(tied)':(x.s.rows[1]?x.s.rows[1].n.name:'—'),'+'+x.s.lead,x.s.leadPct.toFixed(1)+'%',
    x.s.tie?{pill:'tie',t:'TIE'}:x.s.leadPct<thr?{pill:'close',t:'CLOSE'}:{pill:'ok',t:'clear'}]})));
  const top=list.slice(0,15);
  mk('c5',{type:'bar',data:{labels:top.map(x=>x.c.name),datasets:[{label:'Lead % of category votes',data:top.map(x=>+x.s.leadPct.toFixed(1)),backgroundColor:top.map(x=>x.s.tie?'#f87171':x.s.leadPct<thr?'#fb923c':'#a855f7')}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}});
  const W={};
  list.forEach(x=>x.s.leaders.forEach(n=>{const k=n.name.trim().toLowerCase();const w=W[k]=W[k]||{name:n.name,wins:0,tied:0,cats:[]};
    if(x.s.tie)w.tied++;else w.wins++;w.cats.push(x.c.name+(x.s.tie?' (tie)':''));}));
  const ws=Object.values(W).sort((a,b)=>b.wins-a.wins||b.tied-a.tied);
  fillTable($('wtb'),ws.map(w=>({cells:[w.name+(w.wins>=2?' 🏆':''),w.wins,w.tied,w.cats.join(', ')]})));
  const t12=ws.slice(0,12);
  mk('c6',{type:'bar',data:{labels:t12.map(w=>w.name),datasets:[{label:'Outright wins',data:t12.map(w=>w.wins),backgroundColor:'#f5c542'},{label:'Tied wins',data:t12.map(w=>w.tied),backgroundColor:'#f87171'}]},
    options:{scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}}}});
  kpis();
}

async function swap(table,a,b){
  if(!a||!b)return;
  const A=a.sort,B=b.sort;
  await sb.from(table).update({sort:B}).eq('id',a.id);
  await db(sb.from(table).update({sort:A}).eq('id',b.id),'Moved');
}
async function addCat(){
  const name=$('newcat').value.trim();if(!name)return;
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(await db(sb.from('categories').insert({id,name,sort:Math.max(0,...CATS.map(c=>c.sort))+1}),'Category added'))$('newcat').value='';
}
async function uploadImg(file,id){
  const bmp=await createImageBitmap(file);const sc=Math.min(1,800/bmp.width);
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
  const path=id+'-'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('nominee-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});
  if(error)throw error;
  return sb.storage.from('nominee-images').getPublicUrl(path).data.publicUrl;
}
const nkey=s=>String(s||'').trim().toLowerCase();
function imageFor(name,exceptId){
  const k=nkey(name);
  for(const c of CATS)for(const m of c.noms)if(m.id!==exceptId&&nkey(m.name)===k&&m.img)return m.img;
  return null;
}
async function propagate(name,url,exceptId){      // same game name in other categories gets the same picture
  const ids=[];CATS.forEach(c=>c.noms.forEach(m=>{if(m.id!==exceptId&&nkey(m.name)===nkey(name)&&m.img!==url)ids.push(m.id);}));
  if(!ids.length)return 0;
  const r=await sb.from('nominees').update({image_url:url}).in('id',ids);
  if(r.error){toast('Error: '+r.error.message);return 0;}
  return ids.length;
}
async function saveNominee(n,nameVal,urlVal,msg){
  nameVal=nameVal.trim();urlVal=(urlVal||'').trim();
  let img=urlVal||null,note='';
  if(!img&&!n.img){const ex=imageFor(nameVal,n.id);if(ex){img=ex;note=' (picture copied from the same game)';}}
  const r=await sb.from('nominees').update({name:nameVal,image_url:img}).eq('id',n.id);
  if(r.error){toast('Error: '+r.error.message);return;}
  let cnt=0;if(img&&img!==n.img)cnt=await propagate(nameVal,img,n.id);
  toast((msg||'Saved')+note+(cnt?' · same picture applied to '+cnt+' other categor'+(cnt>1?'ies':'y'):''));
  await refresh({editor:true});
}
async function syncPics(){                         // fill missing pictures for same-name nominees
  const G={};CATS.forEach(c=>c.noms.forEach(m=>{(G[nkey(m.name)]=G[nkey(m.name)]||[]).push(m);}));
  let n=0;
  for(const k in G){const g=G[k],src=g.find(m=>m.img);if(!src)continue;
    const ids=g.filter(m=>!m.img).map(m=>m.id);
    if(ids.length){const r=await sb.from('nominees').update({image_url:src.img}).in('id',ids);if(!r.error)n+=ids.length;}}
  toast(n?'Copied pictures to '+n+' nominees.':'Everything already matches.');
  await refresh({editor:true});
}

      const u2=el('button','sm','↑');u2.onclick=()=>swap('nominees',n,c.noms[ni-1]);
      const d2=el('button','sm','↓');d2.onclick=()=>swap('nominees',n,c.noms[ni+1]);
      const x=el('button','sm red','Delete');x.onclick=async()=>{
        if(!confirm('Delete nominee "'+n.name+'" and its votes?'))return;

        db(sb.from('nominees').delete().eq('id',n.id),'Nominee deleted');};
      row.append(th,name,url,file,upl,s2,u2,d2,x);body.append(row);
    });
    const add=el('div','nom');
    const an=el('input','nm');an.type='text';an.placeholder='+ New nominee name';

    const ab=el('button','sm gold','Add nominee');
    ab.onclick=async()=>{const v=an.value.trim();if(!v)return;openSet.add(c.id);
      const given=au.value.trim()||null,img=given||imageFor(v)||null;
      const r=await sb.from('nominees').insert({category_id:c.id,name:v,image_url:img,sort:Math.max(0,...c.noms.map(m=>m.sort))+1});
      if(r.error){toast('Error: '+r.error.message);return;}
      const cnt=given?await propagate(v,given,null):0;
      toast('Nominee added'+(!given&&img?' (picture copied from the same game)':'')+(cnt?' · picture applied to '+cnt+' other categor'+(cnt>1?'ies':'y'):''));
      await refresh({editor:true});};
    add.append(an,au,ab);body.append(add);

  });

function csv(){

  const rows=[['category','nominee','votes','share_percent']];
  CATS.forEach(c=>{const tot=sum(T[c.id]);c.noms.forEach(n=>{const v=(T[c.id]||{})[n.id]||0;rows.push([c.name,n.name,v,tot?(v*100/tot).toFixed(1):'0']);});});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
  a.download='phantom-awards-results.csv';a.click();
}
start();
</script>
